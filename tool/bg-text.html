<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/bg-text - Background Removal Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #1a1a1a;
            color: #ffffff;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
        }

        .home-link {
            color: #888;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s ease;
        }

        .home-link:hover {
            color: #c0392b;
        }

        .title {
            font-size: 36px;
            font-weight: 700;
            color: #c0392b;
            text-align: center;
            flex-grow: 1;
        }

        .description {
            text-align: center;
            color: #888;
            margin-bottom: 40px;
            font-size: 16px;
        }

        .upload-section {
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
        }

        .upload-area {
            border: 2px dashed #555;
            border-radius: 8px;
            padding: 40px;
            cursor: pointer;
            transition: border-color 0.3s ease, opacity 0.3s ease;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: #c0392b;
        }

        .upload-area.dragover {
            border-color: #c0392b;
            background-color: #333;
        }

        .upload-area.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #333;
        }

        .upload-area.disabled:hover {
            border-color: #333;
        }

        .upload-icon {
            font-size: 48px;
            color: #555;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #888;
            font-size: 16px;
        }

        .file-input {
            display: none;
        }

        .btn {
            background-color: #c0392b;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            transition: background-color 0.3s ease;
            min-width: 100px;
            text-align: center;
        }

        .btn:hover {
            background-color: #a93226;
        }

        .btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .progress-section {
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #444;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background-color: #c0392b;
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            color: #888;
            font-size: 14px;
        }

        .results-section {
            display: none;
        }

        .image-comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .image-container {
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .image-label {
            color: #c0392b;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .result-image {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
        }

        .download-btn {
            margin-top: 10px;
        }

        .text-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 6px;
            background-color: #333;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            margin-top: 10px;
            resize: vertical;
            min-height: 60px;
        }

        .text-input:focus {
            outline: none;
            border-color: #c0392b;
        }

        .text-input::placeholder {
            color: #888;
        }

        .slider-container {
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .slider-label {
            color: #888;
            font-size: 12px;
            margin-bottom: 5px;
            display: block;
        }

        .slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #444;
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #c0392b;
            cursor: pointer;
        }

        .slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #c0392b;
            cursor: pointer;
            border: none;
        }

        .color-picker {
            width: 100%;
            height: 40px;
            border: 1px solid #444;
            border-radius: 6px;
            background-color: #333;
            cursor: pointer;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        .color-picker::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-picker::-webkit-color-swatch {
            border: none;
            border-radius: 4px;
        }

        .color-picker::-moz-color-swatch {
            border: none;
            border-radius: 4px;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #444;
            color: #888;
            font-size: 14px;
        }

        .footer a {
            color: #c0392b;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .image-comparison {
                grid-template-columns: 1fr;
            }
            
            .title {
                font-size: 28px;
            }
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="../index.html" class="home-link">← home</a>
            <h1 class="title">/bg-text</h1>
            <div></div>
        </div>

        <div class="description">
            Remove backgrounds from images using AI-powered segmentation with BRIA 1.4 model<br>
            <small style="color: #666; font-size: 12px;">⏱️ Downloads ~30s first time, then cached for instant loading</small>
        </div>

        <div class="upload-section">
            <div class="upload-area disabled" id="uploadArea">
                <div class="upload-icon">📷</div>
                <div class="upload-text" id="uploadText">
                    Loading model... Please wait
                </div>
            </div>
            <input type="file" id="fileInput" class="file-input" accept="image/*">
            <button class="btn" id="processBtn" disabled>Remove Background</button>
        </div>

        <div class="progress-section" id="progressSection">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">Loading model...</div>
        </div>

        <div class="results-section" id="resultsSection">
            <div class="image-comparison">
                <div class="image-container">
                    <div class="image-label">Background Removed</div>
                    <img id="processedImage" class="result-image" alt="Processed image">
                    <button class="btn download-btn" id="downloadBtn">Download</button>
                </div>
                <div class="image-container">
                    <div class="image-label">With Text Layer</div>
                    <img id="compositedImage" class="result-image" alt="Image with text">
                    <textarea id="textInput" class="text-input" placeholder="Enter text to overlay behind the subject..."></textarea>
                    <div class="slider-container">
                        <label class="slider-label">Text Size</label>
                        <input type="range" id="textSizeSlider" class="slider" min="10" max="400" value="50">
                    </div>
                    <div class="slider-container">
                        <label class="slider-label">Text X Position</label>
                        <input type="range" id="textXSlider" class="slider" min="0" max="100" value="50">
                    </div>
                    <div class="slider-container">
                        <label class="slider-label">Text Y Position</label>
                        <input type="range" id="textYSlider" class="slider" min="0" max="100" value="50">
                    </div>
                    <div class="slider-container">
                        <label class="slider-label">Text Color</label>
                        <input type="color" id="textColorPicker" class="color-picker" value="#ffffff">
                    </div>
                    <div style="display: flex; justify-content: center; margin-top: 10px;">
                        <button class="btn" id="downloadCompositedBtn">Download</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            made with ❤️ by <a href="https://github.com/nuwandavek">nuwandavek</a> | <a href="https://github.com/nuwandavek/llm-tools/blob/master/tool/bg-text.html">view source</a>
        </div>
    </div>

    <script type="module">
        import { AutoModel, AutoProcessor, env, RawImage } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

        // Configure transformers.js
        env.allowLocalModels = false;
        env.backends.onnx.wasm.proxy = true;

        class BackgroundRemover {
            constructor() {
                this.model = null;
                this.processor = null;
                this.isModelLoaded = false;
                this.initializeElements();
                this.setupEventListeners();
                this.loadModel();
            }

            initializeElements() {
                this.uploadArea = document.getElementById('uploadArea');
                this.uploadText = document.getElementById('uploadText');
                this.fileInput = document.getElementById('fileInput');
                this.processBtn = document.getElementById('processBtn');
                this.progressSection = document.getElementById('progressSection');
                this.progressFill = document.getElementById('progressFill');
                this.progressText = document.getElementById('progressText');
                this.resultsSection = document.getElementById('resultsSection');
                this.processedImage = document.getElementById('processedImage');
                this.compositedImage = document.getElementById('compositedImage');
                this.textInput = document.getElementById('textInput');
                this.textSizeSlider = document.getElementById('textSizeSlider');
                this.textXSlider = document.getElementById('textXSlider');
                this.textYSlider = document.getElementById('textYSlider');
                this.textColorPicker = document.getElementById('textColorPicker');
                this.downloadBtn = document.getElementById('downloadBtn');
                this.downloadCompositedBtn = document.getElementById('downloadCompositedBtn');
            }

            setupEventListeners() {
                // Upload area events
                this.uploadArea.addEventListener('click', () => {
                    if (!this.isModelLoaded) return;
                    this.fileInput.click();
                });
                this.uploadArea.addEventListener('dragover', this.handleDragOver.bind(this));
                this.uploadArea.addEventListener('dragleave', this.handleDragLeave.bind(this));
                this.uploadArea.addEventListener('drop', this.handleDrop.bind(this));

                // File input
                this.fileInput.addEventListener('change', this.handleFileSelect.bind(this));

                // Process button
                this.processBtn.addEventListener('click', this.processImage.bind(this));

                // Download buttons
                this.downloadBtn.addEventListener('click', this.downloadImage.bind(this));
                this.downloadCompositedBtn.addEventListener('click', this.downloadCompositedImage.bind(this));


                // Text input changes
                this.textInput.addEventListener('input', this.updateCompositeImage.bind(this));
                this.textSizeSlider.addEventListener('input', this.updateCompositeImage.bind(this));
                this.textXSlider.addEventListener('input', this.updateCompositeImage.bind(this));
                this.textYSlider.addEventListener('input', this.updateCompositeImage.bind(this));
                this.textColorPicker.addEventListener('input', this.updateCompositeImage.bind(this));
            }

            handleDragOver(e) {
                e.preventDefault();
                if (!this.isModelLoaded) return;
                this.uploadArea.classList.add('dragover');
            }

            handleDragLeave(e) {
                e.preventDefault();
                this.uploadArea.classList.remove('dragover');
            }

            handleDrop(e) {
                e.preventDefault();
                if (!this.isModelLoaded) return;
                this.uploadArea.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length > 0 && files[0].type.startsWith('image/')) {
                    this.handleFile(files[0]);
                }
            }

            handleFileSelect(e) {
                if (!this.isModelLoaded) return;
                const file = e.target.files[0];
                if (file) {
                    this.handleFile(file);
                }
            }

            handleFile(file) {
                this.selectedFile = file;
                this.processBtn.disabled = false;
                
                // Show preview
                const reader = new FileReader();
                reader.onload = (e) => {
                    this.uploadArea.innerHTML = `
                        <img src="${e.target.result}" style="max-width: 350px; max-height: 300px; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
                        <div style="margin-top: 15px; color: #888; font-size: 14px;">Click to change image</div>
                    `;
                };
                reader.readAsDataURL(file);
            }

            async loadModel() {
                if (this.isModelLoaded) return;

                // Check if model is cached
                const modelCached = await this.checkModelCache();
                
                if (modelCached) {
                    this.showProgress('Loading cached model...', 0);
                } else {
                    this.showProgress('Downloading BRIA 1.4 model... (this will be cached)', 0);
                }

                try {
                    // Load the BRIA 1.4 background removal model
                    this.updateProgress(20, modelCached ? 'Loading cached model...' : 'Downloading model...');
                    this.model = await AutoModel.from_pretrained('briaai/RMBG-1.4', {
                        config: { model_type: 'custom' },
                        progress_callback: (progress) => {
                            if (!modelCached && progress.status === 'downloading') {
                                const percent = Math.round((progress.loaded / progress.total) * 40) + 20;
                                this.updateProgress(percent, `Downloading model... ${Math.round((progress.loaded / progress.total) * 100)}%`);
                            }
                        }
                    });

                    this.updateProgress(60, modelCached ? 'Loading cached processor...' : 'Downloading processor...');
                    this.processor = await AutoProcessor.from_pretrained('briaai/RMBG-1.4', {
                        config: {
                            do_normalize: true,
                            do_resize: true,
                            image_mean: [0.5, 0.5, 0.5],
                            image_std: [1, 1, 1],
                            size: { width: 1024, height: 1024 }
                        },
                        progress_callback: (progress) => {
                            if (!modelCached && progress.status === 'downloading') {
                                const percent = Math.round((progress.loaded / progress.total) * 30) + 60;
                                this.updateProgress(percent, `Downloading processor... ${Math.round((progress.loaded / progress.total) * 100)}%`);
                            }
                        }
                    });

                    this.updateProgress(95, 'Saving to cache...');
                    
                    // Mark as cached in localStorage
                    localStorage.setItem('bg-text-model-cached', 'true');

                    this.isModelLoaded = true;
                    this.updateProgress(100, modelCached ? 'Cached model loaded successfully!' : 'Model downloaded and cached successfully!');
                    
                    // Enable upload area
                    this.uploadArea.classList.remove('disabled');
                    this.uploadText.textContent = 'Drop an image here or click to select';
                    
                    // Hide progress after a short delay
                    setTimeout(() => {
                        this.hideProgress();
                    }, 1000);

                } catch (error) {
                    console.error('Error loading model:', error);
                    this.updateProgress(0, 'Error loading BRIA model. Please try again.');
                }
            }

            async checkModelCache() {
                // Check if we've cached the model before using localStorage
                const cached = localStorage.getItem('bg-text-model-cached');
                return !!cached;
            }

            async processImage() {
                if (!this.selectedFile) return;

                this.resultsSection.style.display = 'none';
                
                // Load model if not already loaded
                if (!this.isModelLoaded) {
                    await this.loadModel();
                }

                if (!this.isModelLoaded) return;

                this.showProgress('Processing image...', 0);

                try {
                    this.updateProgress(20, 'Loading image...');
                    
                    // Load and preprocess image using RawImage
                    const imageUrl = URL.createObjectURL(this.selectedFile);
                    const image = await RawImage.fromURL(imageUrl);
                    
                    this.updateProgress(40, 'Preprocessing...');
                    const { pixel_values } = await this.processor(image);

                    this.updateProgress(70, 'Running segmentation...');
                    
                    // Predict alpha matte
                    const { output } = await this.model({ input: pixel_values });
                    const mask = await RawImage.fromTensor(output[0].mul(255).to('uint8'))
                        .resize(image.width, image.height);

                    this.updateProgress(90, 'Applying mask...');

                    // Create original canvas
                    const originalCanvas = document.createElement('canvas');
                    originalCanvas.width = image.width;
                    originalCanvas.height = image.height;
                    const originalCtx = originalCanvas.getContext('2d');
                    originalCtx.drawImage(image.toCanvas(), 0, 0);

                    // Create result canvas
                    const resultCanvas = document.createElement('canvas');
                    resultCanvas.width = image.width;
                    resultCanvas.height = image.height;
                    const resultCtx = resultCanvas.getContext('2d');
                    
                    // Draw original image
                    resultCtx.drawImage(image.toCanvas(), 0, 0);

                    // Apply alpha mask
                    const pixelData = resultCtx.getImageData(0, 0, image.width, image.height);
                    for (let i = 0; i < mask.data.length; ++i) {
                        pixelData.data[4 * i + 3] = mask.data[i];
                    }
                    resultCtx.putImageData(pixelData, 0, 0);

                    // Show results
                    this.showResults(originalCanvas, resultCanvas);
                    
                    this.updateProgress(100, 'Complete!');
                    setTimeout(() => this.hideProgress(), 1000);

                    // Clean up URL
                    URL.revokeObjectURL(imageUrl);

                } catch (error) {
                    console.error('Error processing image:', error);
                    this.updateProgress(0, 'Error processing image. Please try again.');
                }
            }


            showResults(originalCanvas, processedCanvas) {
                this.processedImage.src = processedCanvas.toDataURL('image/png');
                this.processedCanvas = processedCanvas;
                this.originalCanvas = originalCanvas;
                
                // Generate initial composite image
                this.updateCompositeImage();
                
                this.resultsSection.style.display = 'block';
            }

            downloadImage() {
                if (!this.processedCanvas) return;

                const link = document.createElement('a');
                link.download = 'background-removed.png';
                link.href = this.processedCanvas.toDataURL('image/png');
                link.click();
            }

            downloadCompositedImage() {
                if (!this.compositedCanvas) return;

                const link = document.createElement('a');
                link.download = 'composited-image.png';
                link.href = this.compositedCanvas.toDataURL('image/png');
                link.click();
            }


            updateCompositeImage() {
                if (!this.originalCanvas || !this.processedCanvas) return;

                const canvas = document.createElement('canvas');
                canvas.width = this.originalCanvas.width;
                canvas.height = this.originalCanvas.height;
                const ctx = canvas.getContext('2d');

                // Step 1: Draw the original background
                ctx.drawImage(this.originalCanvas, 0, 0);

                // Step 2: Add text layer if there's text
                const text = this.textInput.value.trim();
                if (text) {
                    // Get values from sliders and color picker
                    const fontSize = parseInt(this.textSizeSlider.value);
                    const textXPercent = parseInt(this.textXSlider.value);
                    const textYPercent = parseInt(this.textYSlider.value);
                    const textColor = this.textColorPicker.value;
                    
                    ctx.font = `900 ${fontSize}px 'Lato', sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    // Set text color from picker
                    ctx.fillStyle = textColor;

                    // Calculate position based on slider percentages
                    const x = (canvas.width * textXPercent) / 100;
                    const y = (canvas.height * textYPercent) / 100;

                    // Handle multi-line text
                    const lines = text.split('\n');
                    const lineHeight = fontSize * 1.1;
                    const startY = y - (lines.length - 1) * lineHeight / 2;

                    lines.forEach((line, index) => {
                        ctx.fillText(line, x, startY + index * lineHeight);
                    });
                }

                // Step 3: Composite the foreground (subject) on top with proper alpha blending
                const processedCtx = this.processedCanvas.getContext('2d');
                const processedImageData = processedCtx.getImageData(0, 0, canvas.width, canvas.height);
                
                // Use globalCompositeOperation for better blending
                ctx.globalCompositeOperation = 'source-over';
                
                // Create a temporary canvas for the foreground with proper alpha
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.putImageData(processedImageData, 0, 0);
                
                // Draw the foreground with proper alpha compositing
                ctx.drawImage(tempCanvas, 0, 0);

                // Update the displayed image and store the canvas
                this.compositedImage.src = canvas.toDataURL('image/png');
                this.compositedCanvas = canvas;
            }

            showProgress(text, percent = 0) {
                this.progressSection.style.display = 'block';
                this.updateProgress(percent, text);
            }

            updateProgress(percent, text) {
                this.progressFill.style.width = `${percent}%`;
                this.progressText.textContent = text;
            }

            hideProgress() {
                this.progressSection.style.display = 'none';
            }
        }

        // Initialize the application
        new BackgroundRemover();
    </script>
</body>
</html>
