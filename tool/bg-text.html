<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/bg-text - Background Removal Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #1a1a1a;
            color: #ffffff;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
        }

        .home-link {
            color: #888;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s ease;
        }

        .home-link:hover {
            color: #c0392b;
        }

        .title {
            font-size: 36px;
            font-weight: 700;
            color: #c0392b;
            text-align: center;
            flex-grow: 1;
        }

        .description {
            text-align: center;
            color: #888;
            margin-bottom: 40px;
            font-size: 16px;
        }

        .upload-section {
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
        }

        .upload-area {
            border: 2px dashed #555;
            border-radius: 8px;
            padding: 40px;
            cursor: pointer;
            transition: border-color 0.3s ease;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: #c0392b;
        }

        .upload-area.dragover {
            border-color: #c0392b;
            background-color: #333;
        }

        .upload-icon {
            font-size: 48px;
            color: #555;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #888;
            font-size: 16px;
        }

        .file-input {
            display: none;
        }

        .btn {
            background-color: #c0392b;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #a93226;
        }

        .btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .progress-section {
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #444;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background-color: #c0392b;
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            color: #888;
            font-size: 14px;
        }

        .results-section {
            display: none;
        }

        .image-comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .image-container {
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .image-label {
            color: #c0392b;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .result-image {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
        }

        .download-btn {
            margin-top: 10px;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #444;
            color: #888;
            font-size: 14px;
        }

        .footer a {
            color: #c0392b;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .image-comparison {
                grid-template-columns: 1fr;
            }
            
            .title {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="../index.html" class="home-link">← home</a>
            <h1 class="title">/bg-text</h1>
            <div></div>
        </div>

        <div class="description">
            Remove backgrounds from images using AI-powered segmentation with BRIA 1.4 model
        </div>

        <div class="upload-section">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📷</div>
                <div class="upload-text">
                    Drop an image here or click to select
                </div>
            </div>
            <input type="file" id="fileInput" class="file-input" accept="image/*">
            <button class="btn" id="processBtn" disabled>Remove Background</button>
        </div>

        <div class="progress-section" id="progressSection">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">Loading model...</div>
        </div>

        <div class="results-section" id="resultsSection">
            <div class="image-comparison">
                <div class="image-container">
                    <div class="image-label">Original</div>
                    <img id="originalImage" class="result-image" alt="Original image">
                </div>
                <div class="image-container">
                    <div class="image-label">Background Removed</div>
                    <img id="processedImage" class="result-image" alt="Processed image">
                    <button class="btn download-btn" id="downloadBtn">Download</button>
                </div>
            </div>
        </div>

        <div class="footer">
            made with ❤️ by <a href="https://github.com/nuwandavek">nuwandavek</a> | <a href="https://github.com/nuwandavek/llm-tools/blob/master/tool/bg-text.html">view source</a>
        </div>
    </div>

    <script type="module">
        import { AutoModel, AutoProcessor, env, RawImage } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

        // Configure transformers.js
        env.allowLocalModels = false;
        env.backends.onnx.wasm.proxy = true;

        class BackgroundRemover {
            constructor() {
                this.model = null;
                this.processor = null;
                this.isModelLoaded = false;
                this.initializeElements();
                this.setupEventListeners();
                this.loadModel();
            }

            initializeElements() {
                this.uploadArea = document.getElementById('uploadArea');
                this.fileInput = document.getElementById('fileInput');
                this.processBtn = document.getElementById('processBtn');
                this.progressSection = document.getElementById('progressSection');
                this.progressFill = document.getElementById('progressFill');
                this.progressText = document.getElementById('progressText');
                this.resultsSection = document.getElementById('resultsSection');
                this.originalImage = document.getElementById('originalImage');
                this.processedImage = document.getElementById('processedImage');
                this.downloadBtn = document.getElementById('downloadBtn');
            }

            setupEventListeners() {
                // Upload area events
                this.uploadArea.addEventListener('click', () => this.fileInput.click());
                this.uploadArea.addEventListener('dragover', this.handleDragOver.bind(this));
                this.uploadArea.addEventListener('dragleave', this.handleDragLeave.bind(this));
                this.uploadArea.addEventListener('drop', this.handleDrop.bind(this));

                // File input
                this.fileInput.addEventListener('change', this.handleFileSelect.bind(this));

                // Process button
                this.processBtn.addEventListener('click', this.processImage.bind(this));

                // Download button
                this.downloadBtn.addEventListener('click', this.downloadImage.bind(this));
            }

            handleDragOver(e) {
                e.preventDefault();
                this.uploadArea.classList.add('dragover');
            }

            handleDragLeave(e) {
                e.preventDefault();
                this.uploadArea.classList.remove('dragover');
            }

            handleDrop(e) {
                e.preventDefault();
                this.uploadArea.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length > 0 && files[0].type.startsWith('image/')) {
                    this.handleFile(files[0]);
                }
            }

            handleFileSelect(e) {
                const file = e.target.files[0];
                if (file) {
                    this.handleFile(file);
                }
            }

            handleFile(file) {
                this.selectedFile = file;
                this.processBtn.disabled = false;
                
                // Show preview
                const reader = new FileReader();
                reader.onload = (e) => {
                    this.uploadArea.innerHTML = `
                        <img src="${e.target.result}" style="max-width: 200px; max-height: 200px; border-radius: 6px;">
                        <div style="margin-top: 10px; color: #888;">Click to change image</div>
                    `;
                };
                reader.readAsDataURL(file);
            }

            async loadModel() {
                if (this.isModelLoaded) return;

                this.showProgress('Loading BRIA 1.4 model...', 0);

                try {
                    // Load the BRIA 1.4 background removal model
                    this.updateProgress(20, 'Loading model...');
                    this.model = await AutoModel.from_pretrained('briaai/RMBG-1.4', {
                        config: { model_type: 'custom' }
                    });

                    this.updateProgress(60, 'Loading processor...');
                    this.processor = await AutoProcessor.from_pretrained('briaai/RMBG-1.4', {
                        config: {
                            do_normalize: true,
                            do_resize: true,
                            image_mean: [0.5, 0.5, 0.5],
                            image_std: [1, 1, 1],
                            size: { width: 1024, height: 1024 }
                        }
                    });

                    this.isModelLoaded = true;
                    this.updateProgress(100, 'BRIA 1.4 model loaded successfully!');
                    
                    // Hide progress after a short delay
                    setTimeout(() => {
                        this.hideProgress();
                    }, 1000);

                } catch (error) {
                    console.error('Error loading model:', error);
                    this.updateProgress(0, 'Error loading BRIA model. Please try again.');
                }
            }

            async processImage() {
                if (!this.selectedFile) return;

                this.resultsSection.style.display = 'none';
                
                // Load model if not already loaded
                if (!this.isModelLoaded) {
                    await this.loadModel();
                }

                if (!this.isModelLoaded) return;

                this.showProgress('Processing image...', 0);

                try {
                    this.updateProgress(20, 'Loading image...');
                    
                    // Load and preprocess image using RawImage
                    const imageUrl = URL.createObjectURL(this.selectedFile);
                    const image = await RawImage.fromURL(imageUrl);
                    
                    this.updateProgress(40, 'Preprocessing...');
                    const { pixel_values } = await this.processor(image);

                    this.updateProgress(70, 'Running segmentation...');
                    
                    // Predict alpha matte
                    const { output } = await this.model({ input: pixel_values });
                    const mask = await RawImage.fromTensor(output[0].mul(255).to('uint8'))
                        .resize(image.width, image.height);

                    this.updateProgress(90, 'Applying mask...');

                    // Create original canvas
                    const originalCanvas = document.createElement('canvas');
                    originalCanvas.width = image.width;
                    originalCanvas.height = image.height;
                    const originalCtx = originalCanvas.getContext('2d');
                    originalCtx.drawImage(image.toCanvas(), 0, 0);

                    // Create result canvas
                    const resultCanvas = document.createElement('canvas');
                    resultCanvas.width = image.width;
                    resultCanvas.height = image.height;
                    const resultCtx = resultCanvas.getContext('2d');
                    
                    // Draw original image
                    resultCtx.drawImage(image.toCanvas(), 0, 0);

                    // Apply alpha mask
                    const pixelData = resultCtx.getImageData(0, 0, image.width, image.height);
                    for (let i = 0; i < mask.data.length; ++i) {
                        pixelData.data[4 * i + 3] = mask.data[i];
                    }
                    resultCtx.putImageData(pixelData, 0, 0);

                    // Show results
                    this.showResults(originalCanvas, resultCanvas);
                    
                    this.updateProgress(100, 'Complete!');
                    setTimeout(() => this.hideProgress(), 1000);

                    // Clean up URL
                    URL.revokeObjectURL(imageUrl);

                } catch (error) {
                    console.error('Error processing image:', error);
                    this.updateProgress(0, 'Error processing image. Please try again.');
                }
            }


            showResults(originalCanvas, processedCanvas) {
                this.originalImage.src = originalCanvas.toDataURL('image/png');
                this.processedImage.src = processedCanvas.toDataURL('image/png');
                this.processedCanvas = processedCanvas;
                this.resultsSection.style.display = 'block';
            }

            downloadImage() {
                if (!this.processedCanvas) return;

                const link = document.createElement('a');
                link.download = 'background-removed.png';
                link.href = this.processedCanvas.toDataURL('image/png');
                link.click();
            }

            showProgress(text, percent = 0) {
                this.progressSection.style.display = 'block';
                this.updateProgress(percent, text);
            }

            updateProgress(percent, text) {
                this.progressFill.style.width = `${percent}%`;
                this.progressText.textContent = text;
            }

            hideProgress() {
                this.progressSection.style.display = 'none';
            }
        }

        // Initialize the application
        new BackgroundRemover();
    </script>
</body>
</html>
